name: open_data_pipeline
version: "0.1.0"
config-version: 2
profile: open_data_pipeline

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  open_data_pipeline:
    staging:
      +materialized: view
    core:
      +materialized: table
    marts:
      # Batch marts are written straight to Parquet (external); each mart is one folder under
      # out/marts/. The incremental stream marts are tables that publish with a post-hook.
      +materialized: external
      +options:
        per_thread_output: true
        overwrite: true
      +contract:
        enforced: true
