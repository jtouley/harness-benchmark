name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: npm install -g @anthropic-ai/claude-code@2.1.294
      # Repos in PRIVATE_REPOS cannot be fetched with no credentials (no secret is configured).
      # Their frameworks are skipped with a warning. Every other framework (baseline included)
      # is fetched by name, and `cbench fetch` checks out its pinned sha and checks it
      # (cbench/lock.py), so a bad sha or an unreachable unlisted repo fails the job.
      # `cbench verify` recomputes results from all frameworks, so it runs only when none is skipped.
      - name: Split pinned frameworks into fetchable and private
        id: access
        env:
          PRIVATE_REPOS: https://github.com/jtouley/cadence
        run: |
          public="" private=""
          for name in $(jq -r '.frameworks | keys_unsorted[]' frameworks.lock.json); do
            repo=$(jq -r --arg n "$name" '.frameworks[$n].repo // ""' frameworks.lock.json)
            case " $PRIVATE_REPOS " in
              *" $repo "*) private="$private $name" ;;
              *) public="$public $name" ;;
            esac
          done
          [ -n "$public" ] || { echo "::error::no public framework found in frameworks.lock.json"; exit 1; }
          echo "public=${public# }" >> "$GITHUB_OUTPUT"
          echo "private=${private# }" >> "$GITHUB_OUTPUT"
          if [ -n "$private" ]; then
            echo "::warning title=private frameworks skipped::${private# } (in PRIVATE_REPOS) not fetched, install-checked or verified in CI. Run 'python -m cbench fetch && python -m cbench verify' locally with access."
          fi
      - name: Fetch pinned frameworks (checks each pinned sha)
        run: uv run --frozen --with tokenizers python -m cbench fetch ${{ steps.access.outputs.public }}
      - name: Install every fetchable framework twice and compare the trees
        if: steps.access.outputs.private != ''
        run: uv run --frozen --with tokenizers python -m cbench install-check ${{ steps.access.outputs.public }}
      - name: Verify every committed result byte for byte
        if: steps.access.outputs.private == ''
        run: uv run --frozen --with tokenizers python -m cbench verify
      - name: Unit and pipeline tests
        # HB_TEST_BUDGET fails the run when the suite gets much slower (tests/time_budget.py).
        env:
          HB_TEST_BUDGET: "1"
        run: uv run --frozen --with tokenizers python -m pytest -q
      - name: Regenerate the report
        run: uv run --frozen --with tokenizers python -m cbench report
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: results/
