[project]
name = "harness-benchmark"
version = "0.1.0"
description = "Reproducible benchmark of AI coding-workflow harnesses for Claude Code."
requires-python = ">=3.11"
# Exact pins: the tokenizer asset is hash-checked at load time, and uv.lock pins the rest.
dependencies = [
  "anthropic==0.37.1",
  "tokenizers==0.20.3",
  "pytest==8.3.4",
]

[dependency-groups]
# The pipeline task family's builder code: answer key, grader and their tests (golden/pipeline/pipetask).
# Installed by default so `uv run pytest` covers it; `uv sync --no-group pipeline` leaves it out.
pipeline = [
  "duckdb==1.5.6",
  "pyyaml==6.0.3",
]

[tool.uv]
package = false
default-groups = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
